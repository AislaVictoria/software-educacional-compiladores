services:
  backend:
    build:
      context: ./backend
    container_name: trabalho1-backend
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: trabalho1-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
